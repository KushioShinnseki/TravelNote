name: CD - Build deliverables

on:
  push:
    branches: [main]
    tags: ['web-v*', 'app-v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: "构建完成后创建 GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Android project
        id: android
        shell: bash
        run: |
          if [[ -f mobile/settings.gradle.kts && -f mobile/app/build.gradle.kts ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        run: docker build --tag travelnote-web:${{ github.sha }} .

      - name: Smoke test Docker image
        run: |
          docker run --detach --name travelnote-web-cd --publish 8080:80 travelnote-web:${{ github.sha }}
          curl --fail --retry 10 --retry-delay 1 http://127.0.0.1:8080/
          docker rm --force travelnote-web-cd

      - name: Package Docker image
        run: |
          mkdir -p artifacts
          docker save travelnote-web:${{ github.sha }} | gzip -9 > artifacts/travelnote-web-image.tar.gz
          sha256sum artifacts/travelnote-web-image.tar.gz > artifacts/travelnote-web-image.tar.gz.sha256

      - name: Package web ZIP
        run: |
          (cd dist && zip -r ../artifacts/travelnote-web.zip .)
          sha256sum artifacts/travelnote-web.zip > artifacts/travelnote-web.zip.sha256

      - name: Set up Java 17
        if: steps.android.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        if: steps.android.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate Android signing secrets
        if: steps.android.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Missing GitHub Actions secret: $value"
              exit 1
            fi
          done

      - name: Decode self-signed keystore
        if: steps.android.outputs.enabled == 'true'
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > travelnote-release.keystore

      - name: Build release APK
        if: steps.android.outputs.enabled == 'true'
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/travelnote-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Collect APK and checksum
        if: steps.android.outputs.enabled == 'true'
        run: |
          find mobile/app/build/outputs/apk/release -name '*.apk' -exec cp {} artifacts/travelnote-release.apk \;
          sha256sum artifacts/travelnote-release.apk > artifacts/travelnote-release.apk.sha256

      - name: Remove signing keystore
        if: always() && steps.android.outputs.enabled == 'true'
        run: rm -f mobile/travelnote-release.keystore

      - name: Upload CD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: travelnote-cd-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Download CD artifacts
        uses: actions/download-artifact@v4
        with:
          name: travelnote-cd-${{ github.sha }}
          path: artifacts

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=cd-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/travelnote-web.zip
            artifacts/travelnote-web.zip.sha256
            artifacts/travelnote-web-image.tar.gz
            artifacts/travelnote-web-image.tar.gz.sha256
            artifacts/travelnote-release.apk
            artifacts/travelnote-release.apk.sha256
